<!-- Front-end -->
<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>Email Confirmation</h2>
    <form id="emailForm">
        <label>Enter Email:</label>
        <input type="email" id="email1" required><br><br>
        
        <label>Confirm Email:</label>
        <input type="email" id="email2" required><br><br>
        
        <button type="button" id="confirmBtn">Confirm</button>
    </form>
    <div id="message"></div>

    <script>
        $(document).ready(function() {
            $('#confirmBtn').click(function() {
                const email1 = $('#email1').val();
                const email2 = $('#email2').val();
                const messageDiv = $('#message');

                if (email1 === email2) {
                    messageDiv.html('<p class="success">Email has been confirmed!</p>');
                    alert('Email has been confirmed!');
                } else {
                    messageDiv.html('<p class="error">Emails do not match. Please try again.</p>');
                }
            });
        });
    </script>
</body>
</html>
