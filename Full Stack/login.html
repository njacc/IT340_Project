<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="webTop">
        <div><a href="homepage.html">
                <img src="GSlogo.png" width="20%">
            </a></div>
        <div>
            <h2>Graphic Scouts</h2>
        </div>
        <div>
            <h1>Login page</h1>
        </div>
        <div><a href="compare.html">Compare</a></div>
        <div><a href="register.html">Register</a></div>
        <div>
            <a href="cart.html"><img src="CartIcon.png" width="20%"></a>
        </div>
    </div>

    <section class="products">
        <form class="info-box" onsubmit="return validateLogin()">
            <label>Enter Email:</label>
            <input type="email" id="email1" name="email" required
            pattern="/^[a-zA-Z0-9]+@(gmail|yahoo|outlook|hotmail|aol)\.[A-Za-z]{1,3}$/"
            ><br><br>

            <label>Enter Password: </label>
            <input type="password" id="password1" name="password" required
            pattern="/^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).+$/"
            ><br><br>

            <button type="submit">Login</button>
        </form>
    </section>

    <script>
        function validateLogin() {

            let email = document.getElementById("email1").value;
            let password = document.getElementById("password1").value;

            if (email == "" || password == "") {
                alert("Please enter your email and password.");
                return false;
            }

            alert("Login form submitted");

            return false;
        }

    </script>

</body>

</html>
