<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphic Scouts - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="webTop">
        <div><a href="homepage.html">
                <img src="GSlogo.png" width="20%">
            </a></div>
        <div>
            <h2>Graphic Scouts</h2>
        </div>
        <div>
            <h1>Register page</h1>
        </div>
        <div><a href="compare.html">Compare</a></div>
        <div><a href="login.html">Login</a></div>
        <div>
            <a href="cart.html"><img src="CartIcon.png" width="20%"></a>
        </div>
    </div>

    <section class="products">
        <form class="info-box" id="registerForm">
            <label>Enter Email:</label>
            <input type="email" id="email1" name="email" required
            pattern="[a-zA-Z0-9]+@(gmail|yahoo|outlook|hotmail|aol)\.[A-Za-z]{1,3}"
            ><br><br>

            <label>Confirm Email:</label>
            <input type="email" id="email2" name="confEmail" required
            pattern="[a-zA-Z0-9]+@(gmail|yahoo|outlook|hotmail|aol)\.[A-Za-z]{1,3}"
            ><br><br>

            <label>Enter Password: </label>
            <input type="password" id="password1" name="password" required
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).+$"
            ><br><br>

            <label>Confirm Password: </label>
            <input type="password" id="password2" name="confPassword" required
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).+$"
            ><br><br>

            <button type="submit">Create Account</button>
            <p id="msg"></p>
        </form>

        <script src="app.js"></script>
</body>

</html>
