        <div><a href="compare.html">Compare</a></div>
        <div><a href="login.html">Login</a></div>
    </div>

    <section class="products">
        <form class="info-box" onsubmit="return validateRegister()">
            <label>Enter Email:</label>
            <input type="email" id="email1" required><br><br>

            <label>Confirm Email:</label>
            <input type="email" id="email2" required><br><br>

            <label>Enter Password: </label>
            <input type="password" id="password1" required><br><br>

            <label>Confirm Password: </label>
            <input type="password" id="password2" required><br><br>

            <button type="submit">Create Account</button>
        </form>

        <script>
            function validateRegister() {
                let email1 = document.getElementById("email1").value;
                let email2 = document.getElementById("email2").value;
                let password1 = document.getElementById("password1").value;
                let password2 = document.getElementById("password2").value;

                if (email1 !== email2) {
                    alert("Email addresses dont match");
                    return false;
                }

                if (password1 !== password2) {
                    alert("Passwords dont match");
                    return false;
                }

                alert("Registration Complete!");

                return false;
            }
        </script>
</body>
